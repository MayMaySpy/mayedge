# Alert rules: docs/alert-rules.md. Change the rule there first. Restart backend after edits.

liquidity:
  # Thinner markets raise nothing and are on no Scan board. A Held market always passes.
  min_24h_usd: 1000000
  max_spread_bps: 40

spike:
  # A spike is a minute at least this many times the biggest minute of the last window_min.
  window_min: 60
  price_x: 2
  volume_x: 3
  oi_x: 2
  # Floors, so a dead tape stays quiet.
  min_move_pct: 0.25
  min_volume_usd: 50000
  min_oi_usd: 250000
  min_oi_pct: 0.3

liquidations:
  oi_bps: 20
  min_usd: 100000
  window_s: 120

board:
  # Liquid perps beyond this many percent over 5m are movers.
  move_pct: 0.3
  min_movers: 10
  # Share of the movers that must go the same way.
  agree: 0.8
  # Median 5m move of that side, in percent.
  median_pct: 0.5

held:
  # Mark within this many percent of a Position's Liquidation price.
  liq_distance_pct: 10

funding:
  # On the strip when the hourly rate is this many sigma from the market's own 24h median.
  sigma: 3
  sigma_floor: 0.002
  # Minute samples of the estimate. Settled hourly prints are kept for the life of the desk.
  retention_days: 30

rows:
  # Rules that fire on a market inside this many seconds are one row.
  merge_s: 120
  # A state that has not fired for this long starts afresh.
  quiet_s: 180
  max_new_per_min: 6

activity:
  # A quieter day is sized as if it ranged this many percent.
  range_floor_pct: 3

baseline:
  bars_1m: 240
  min_bars: 30
  level_window_min: 1440
  # A sigma needs this many minutes of samples.
  level_min_samples: 30

outcomes:
  horizon_min: 15
  retention_days: 30

push:
  # Which alert rows push: held (Held markets and Near liquidation), urgent, or all. off to mute.
  alerts: held
  # Algo pushes: errors (an algo stops with an error) or lifecycle (also Planner/Trail entry, stop, target).
  algos: lifecycle
  # Venue down pushes only after this many seconds; recovery pushes with how long it lasted.
  venue_down_after_s: 60
  # The account feed counts as stale after this long while a Position or algo is live.
  account_stale_after_s: 120
  # The same push key stays quiet for this long.
  repeat_s: 600
  # Above this many pushes in a minute, the rest are folded into one digest.
  max_per_min: 12
