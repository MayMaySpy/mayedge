# Alert rules: docs/alert-rules.md. Change the rule there first. Restart backend after edits.

liquidity:
  # Thinner markets raise nothing and are on no Scan board. A Held market always passes.
  min_24h_usd: 1000000
  max_spread_bps: 40

move:
  # A Move is the price going x times its Usual move over 1, 5 or 15 minutes, and past the span's floor.
  # Set on 7 Nov 2026 by replaying the bars the desk serves (ADR 0027).
  x: 12
  floor_1m_pct: 1.0
  floor_5m_pct: 1.5
  floor_15m_pct: 2.0
  # The Usual move is the median of each span's move over this many closed 1m bars.
  usual_bars: 240
  # Share of those bars that must have traded. A Held market skips this.
  live_share: 0.8
  # A Move that has not fired for this long starts afresh.
  quiet_s: 900

liquidations:
  oi_bps: 20
  min_usd: 100000
  window_s: 120

board:
  # Liquid perps beyond this many percent over 5m are movers.
  move_pct: 0.3
  min_movers: 10
  # Share of the movers that must go the same way.
  agree: 0.8
  # The Board line shows while the median 5m move of that side is at least this, in percent. It raises no row.
  median_pct: 0.8

held:
  # Mark within this many percent of a Position's Liquidation price.
  liq_distance_pct: 10
  # A working order makes its market Held only while it is within this many percent of filling.
  order_near_pct: 2

range:
  # Completed UTC days before today. Today is not in either window.
  week_days: 7
  quarter_days: 90

funding:
  # On the strip when the hourly rate is this many sigma from the market's own 24h median.
  sigma: 3
  sigma_floor: 0.002
  # Minute samples of the estimate. Settled hourly prints are kept for the life of the desk.
  retention_days: 30

rows:
  # Rules that fire on a market inside this many seconds are one row.
  merge_s: 120
  # Liquidations or Near liquidation that have not fired for this long start afresh.
  quiet_s: 180
  max_new_per_min: 6
  # How long alert rows are kept. Outcomes stay on outcomes.retention_days.
  log_retention_days: 90

activity:
  # A quieter day is sized as if it ranged this many percent.
  range_floor_pct: 3

baseline:
  # 1m bars kept per perp: the Usual move's 240 and the spans behind them.
  bars_1m: 260
  min_bars: 30
  level_window_min: 1440
  # A sigma needs this many minutes of samples.
  level_min_samples: 30

outcomes:
  horizon_min: 15
  retention_days: 30

setups:
  # docs/setup-rules.md. The Setups board on Scan, rebuilt once an hour. Nothing on it toasts.
  # X1: open interest moved this many percent in 24h, price at most a third of that.
  oi_pct: 5
  oi_over_price: 3
  # X2: the last 72 settled prints, 90% one sign, mean 3x the 30-day median.
  funding_hours: 72
  funding_agree: 0.9
  funding_x: 3
  # X3: BTC moved this much in 24h, and the market is this many points the other side of it.
  board_pct: 1
  gap_pct: 5
  # X4: the last 3 days ranged at most half the 30 before them, within 2% of a Week high or low.
  coil_days: 3
  coil_ratio: 0.5
  coil_near_pct: 2
  # X6: one side's liquidations in 4h at least this many bps of OI, and OI down this much.
  flush_bps: 50
  flush_oi_pct: 3

push:
  # Which alert rows push: held (Held markets and Near liquidation), urgent, or all. off to mute.
  alerts: held
  # Algo pushes: errors (an algo stops with an error) or lifecycle (also Planner/Trail entry, stop, target).
  algos: lifecycle
  # Venue down pushes only after this many seconds; recovery pushes with how long it lasted.
  venue_down_after_s: 60
  # The account feed counts as stale after this long while a Position or algo is live.
  account_stale_after_s: 120
  # A boot after this many seconds names the Down gap. A shorter one stays a plain restart.
  down_after_s: 60
  # The same push key stays quiet for this long.
  repeat_s: 600
  # Above this many pushes in a minute, the rest are folded into one digest.
  max_per_min: 12
  # HH:MM UTC for yesterday's journal. Empty stays off.
  daily_at: ""
  # A fired Price alert on an Idea also pushes: "on" or "off" (the desk toast and Idea log stay).
  ideas: "on"
  # The Position watch (docs/position-rules.md): "on" or "off".
  positions: "on"
  # A Position this long without a Stop, a Planner or a Trail is named in one push.
  no_stop_after_s: 300
  # Funding that has cost this share of a Position's R in dollars pushes once.
  bleed_r: 0.25
  # HH:MM UTC for the brief of every Position. Empty stays off.
  brief_at: "07:00"
  # Answer /status from TELEGRAM_CHAT_ID (read-only: Positions, uPnL, algos, Auto kill). off to ignore.
  commands: status
