# Relative outlier alert settings. Restart backend after edits.
# Scores are roughly "standard deviations from this market's own normal".

min_severity: 2
max_events_per_flush: 20
warmup_s: 20

baseline:
  bars_1m: 240
  min_bars: 30
  level_window_min: 1440
  # Premium, dislocation, funding and OI stay silent until this many minutes of history exist.
  level_min_samples: 30

liquidity:
  # Thinner markets never alert and never reach the board.
  min_24h_usd: 1000000
  max_spread_bps: 40

factors:
  volume:
    rvol: [4, 8]
    min_usd_1m: 50000
    # Volume confirms. Capped below urgent so a tape print alone stays notable.
    score_cap: 6
  price:
    sigma: [4, 6]
    # A move must also clear this many percent (1m, 5m). Stops 0.05% ticks on flat books.
    min_pct: [0.3, 0.6]
    sigma_floor_pct: 0.05
    # Recent residual RMS, excluding the newest 5 bars, can raise the noise floor.
    recent_bars: 30
  oi:
    sigma: [4, 6]
    min_usd: 250000
    sigma_floor_pct: 0.3
  premium:
    sigma: [4, 6]
    sigma_floor_pct: 0.05
  dislocation:
    sigma: [4, 6]
    min_bps: 25
    sigma_floor_bps: 10
  funding:
    sigma: [3, 5]
    sigma_floor: 0.002
  liq_cluster:
    oi_bps: [20, 60]
    min_usd: 100000
    window_s: 120

score:
  sev2: 4
  sev3: 7
  exit: 2
  cap: 12
  board_min: 2.5

episode:
  quiet_s: 180
  rearm_s: 600
  max_new_per_min: 6

# A move shared by the board. Below min_markets the excess is the raw move.
broad:
  min_markets: 15
  move_pct: 0.3
  breadth: 0.6
  beta_max: 3

outcomes:
  horizons_min: [5, 15]
  retention_days: 30
