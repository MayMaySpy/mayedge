[project]
name = "mayedge"
version = "0.1.0"
description = "Personal Lighter perp desk backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "websockets>=13.0",
    "lighter-sdk>=0.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "eth-account>=0.10.0",
]

[project.scripts]
mayedge = "mayedge.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mayedge"]

[dependency-groups]
dev = ["ruff>=0.8.0", "basedpyright>=1.29.0"]

[tool.basedpyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
extraPaths = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingImports = true
reportUndefinedVariable = true
# lighter-sdk exposes ApiClient/SignerClient/etc. but omits them from __all__.
reportPrivateImportUsage = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Catch bugs/footguns; skip pedantic ANN/D noise.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "ASYNC",  # async/await pitfalls (FastAPI)
    "RUF",    # Ruff-specific correctness
]
ignore = [
    "E501",   # line length handled by the formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF001", # ambiguous unicode in strings (often intentional in UI copy)
    "RUF002",
    "RUF003",
    "RUF006", # intentional fire-and-forget broadcast/resubscribe tasks
    "SIM103", # ledger should_fill_when_missing readability
    "SIM105", # try/except/pass is fine in reconnect loops
    "SIM108", # account ws stats parsing readability
    "ASYNC110", # book wait loops until snapshot arrives
]

[tool.ruff.lint.isort]
known-first-party = ["mayedge"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

